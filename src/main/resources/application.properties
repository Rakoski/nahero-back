# PRINCIPAL
server.port=8080
spring.application.name=nahero-back
server.servlet.context-path=/api/v1
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=file:/app/keystore.p12
server.ssl.key-store-password=${SSL_PASSWORD}
server.ssl.key-alias=tomcat

# DB
spring.datasource.url=jdbc:postgresql://${NAHERO_DB_HOST:localhost}:5432/${NAHERO_DB}
spring.datasource.username=${NAHERO_DB_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# AUTH
auth.jwt.token.secret=${NAHERO_JWT_TOKEN}
auth.jwt.access-token.expiration=2
auth.jwt.refresh-token.expiration=4280

# CORS
spring.web.cors.allowed-origins=https://localhost:36643,https://frontend:4200,https://localhost:4200,https://nahero.site,http://localhost:3000
spring.web.cors.allowed-headers=*
spring.web.cors.allowed-methods=*
spring.web.cors.allow-credentials=true

# DOCKER
spring.docker.compose.enabled=false

# STRIPE
payment.stripe.api-key=${STRIPE_API_KEY:}
payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
payment.stripe.price-monthly=${STRIPE_PRICE_MONTHLY:}
payment.stripe.price-yearly=${STRIPE_PRICE_YEARLY:}
payment.stripe.success-url=${STRIPE_SUCCESS_URL:}
payment.stripe.cancel-url=${STRIPE_CANCEL_URL:}

# PAYMENT RECONCILIATION
payment.reconcile.enabled=${PAYMENT_RECONCILE_ENABLED:true}
payment.reconcile.lookback-hours=${PAYMENT_RECONCILE_LOOKBACK_HOURS:24}
payment.reconcile.fixed-delay-ms=${PAYMENT_RECONCILE_FIXED_DELAY_MS:900000}
payment.reconcile.initial-delay-ms=${PAYMENT_RECONCILE_INITIAL_DELAY_MS:60000}
payment.reconcile.max-attempts=${PAYMENT_RECONCILE_MAX_ATTEMPTS:5}
