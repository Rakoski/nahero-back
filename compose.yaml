services:
  postgres:
    image: postgres:16
    container_name: nahero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NAHERO_DB}
      POSTGRES_USER: ${NAHERO_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - nahero-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nahero-postgres-data:
